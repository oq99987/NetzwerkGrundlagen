<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Masterclass | CCNA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="navbar">
      <div class="brand">
        <span>🌐</span> <span id="ui-brand">NetTech Hub</span>
      </div>
      
      <div class="nav-actions">
        <!-- Language Dropdown -->
        <div class="dropdown">
          <button class="dropdown-btn" id="lang-btn" onclick="toggleDropdown()">
            <span id="current-flag">🇩🇪</span> <span id="current-lang-text">Deutsch</span> ▾
          </button>
          <ul class="dropdown-menu" id="lang-menu">
            <li class="dropdown-item" onclick="changeLanguage('de')">🇩🇪 Deutsch</li>
            <li class="dropdown-item" onclick="changeLanguage('el')">🇬🇷 Ελληνικά</li>
            <li class="dropdown-item" onclick="changeLanguage('en')">🇬🇧 English</li>
          </ul>
        </div>
        <!-- Theme Toggle -->
        <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <!-- Sidebar for Modules -->
    <aside class="sidebar">
      <h3 class="sidebar-title" id="ui-module-title">IHK Curriculum (40 Tage)</h3>
      <ul class="module-list" id="module-list">
        <!-- Modules injected via JS -->
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area" id="main-content">
      <!-- Content injected via JS -->
      <div class="loading">Loading content...</div>
    </main>
  </div>

  <!-- Quiz Modal -->
  <div id="quiz-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('quiz-modal')">&times;</span>
      <h2 id="modal-quiz-title">Quiz</h2>
      <div id="quiz-modal-body"></div>
      <div class="modal-footer">
        <button id="quiz-next-btn" class="btn" style="display:none;" onclick="nextQuizQuestion()">Next</button>
      </div>
    </div>
  </div>

  <!-- Flashcard Modal -->
  <div id="flashcard-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('flashcard-modal')">&times;</span>
      <h2 id="modal-flashcard-title">Flashcards</h2>
      <div id="flashcard-modal-body" class="flashcards-container" style="justify-content: center;"></div>
      <div class="modal-footer">
        <button id="fc-prev-btn" class="btn secondary-btn" onclick="prevFlashcard()">Previous</button>
        <span id="fc-counter" style="margin: 0 15px;">1 / 1</span>
        <button id="fc-next-btn" class="btn" onclick="nextFlashcard()">Next</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
